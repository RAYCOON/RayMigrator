name: Deploy ConfigWizard Web

on:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]

concurrency:
  group: deploy-configwizard-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Publish ConfigWizard.Web
        run: >
          dotnet publish
          Raycoon.RayMigrator.ConfigWizard.Web/Raycoon.RayMigrator.ConfigWizard.Web.csproj
          -c Release
          -o publish-output

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: publish-output/wwwroot
