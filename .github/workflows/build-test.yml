name: Build & Test

on:
  push:
    # develop is the working branch: every commit gets a Linux build and the
    # unit tests, and the resulting build-test check on the commit SHA is what
    # the branch protection on main requires when a release is fast-forwarded.
    # main itself is not listed: it only ever receives that fast-forward, and
    # the release tag on the same commit triggers the run that publishes.
    branches: [develop]
    tags: ['v*']
  pull_request:
    branches: [main]

# One run per ref; a newer push to develop cancels the running one. Tag runs
# are never cancelled because Publish Release and Deploy ConfigWizard depend
# on their success.
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify licence version binding
        run: .github/scripts/check-license-version.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit Tests
        run: dotnet test Raycoon.RayMigrator.Tests.Unit/ -c Release --no-build --framework net10.0
